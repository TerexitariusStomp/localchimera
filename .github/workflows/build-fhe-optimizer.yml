name: Build and Push FHE Optimizer Image

on:
  push:
    branches:
      - main
    paths:
      - 'infra/akash-fhe/optimizer.py'
      - 'infra/akash-fhe/Dockerfile.optimizer'
      - 'infra/akash-fhe/requirements.txt'
      - '.github/workflows/build-fhe-optimizer.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/akash-fhe/optimizer.py'
      - 'infra/akash-fhe/Dockerfile.optimizer'
      - 'infra/akash-fhe/requirements.txt'
      - '.github/workflows/build-fhe-optimizer.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fhe-optimizer
  CONTEXT_DIR: infra/akash-fhe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIR }}
          file: ${{ env.CONTEXT_DIR }}/Dockerfile.optimizer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
