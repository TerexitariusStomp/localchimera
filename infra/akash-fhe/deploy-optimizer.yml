---
version: "2.0"

# Horizontally-scalable FHE optimizer deployment on Akash.
# Each pod auto-detects its worker index from the hostname ordinal
# and runs a disjoint subset of the optimization configs.

services:
  fhe-optimizer:
    image: ghcr.io/${IMAGE_OWNER}/fhe-optimizer:sha-23d72fc
    credentials:
      host: ghcr.io
      username: ${IMAGE_OWNER}
      password: ${GHCR_TOKEN}
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
    env:
      - FHE_MODEL_NAME=qwen3.6-35b-a3b
      - FHE_MODEL_ID=Qwen/Qwen3.6-35B-A3B
      - FHE_SCALE_TEST=1
      - FHE_WORKER_INDEX=0
      - FHE_WORKER_COUNT=1
      - FHE_AUTOSTART=0

profiles:
  compute:
    fhe-h100:
      resources:
        cpu:
          units: 32
        memory:
          size: 128Gi
        storage:
          size: 100Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: h100
  placement:
    akash:
      attributes:
        host: akash
      signed_by:
        any_of:
          - ""
      pricing:
        fhe-h100:
          denom: uact
          amount: 1000000

deployment:
  fhe-optimizer:
    akash:
      profile: fhe-h100
      count: 1
